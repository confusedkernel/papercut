<div class="search-popover" data-search-popover hidden>
  <div class="search-popover__summary" data-search-status aria-live="polite">Loading search index...</div>
  <div class="search-popover__results" data-search-results></div>
  <p class="search-popover__empty" data-search-empty hidden>No results found.</p>
  <footer class="search-popover__footer" data-search-footer>
    <span>Press Esc to close</span>
    <a class="underline-offset-4 hover:underline" href="{{ "search/" | relURL }}" data-search-view-all>Show all results</a>
  </footer>
</div>
